<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subroute</title>
  <link rel="stylesheet" href="/control/styles.css">
  <script src="/control/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Subroute</h1>
    <p>Clients that request <code>default</code> follow this selection.</p>
    <form id="routing">
      <label>Model<select id="model" required disabled></select></label>
      <label id="effort-field" hidden>Reasoning effort<select id="effort"></select></label>
      <label id="speed-field" hidden><input id="fast" type="checkbox"> Fast mode</label>
      <div class="actions">
        <button id="save" disabled>Save model</button>
        <button id="refresh" type="button" disabled>Refresh subscription models</button>
      </div>
    </form>
    <p id="status" role="status">Loading models…</p>
  </main>
</body>
</html>
