[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subroute"
version = "0.1.0"
description = "A minimal, native LiteLLM Proxy gateway configuration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "litellm[extra-proxy,proxy]==1.106.2",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6"]
music = ["mcp==2.3.0", "mutagen==1.48.1"]
search = ["mcp==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subroute = ["control/*.html", "control/*.css", "control/*.js", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["acceptance"]
pythonpath = ["src"]
markers = ["live: sends real HTTP requests to a running Subroute gateway and configured providers"]
