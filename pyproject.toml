[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-llm-gateway"
version = "0.1.0"
description = "A minimal LiteLLM kernel with thin provider adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.80",
    "pydantic>=2.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
