services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm-local-db
      POSTGRES_DB: litellm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm-local-db
      POSTGRES_DB: litellm_staging
    volumes:
      - litellm-postgres-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm_staging"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    image: subroute-gateway:advisor-ranker-v1
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      antigravity:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config:/app/config
      - ./src:/app/src:ro
      - ~/.codex/auth.json:/root/.codex/auth.json:ro
    environment:
      - PYTHONPATH=/app/src
      - HEALTH_CHECK_TIMEOUT_SECONDS=10
      # Preserve the existing production policy file during migration.
      - ACTIVE_MODEL_STATE_PATH=/app/config/active_model.json
      - DATABASE_URL=postgresql://litellm:litellm-local-db@postgres:5432/litellm
      - SUBROUTE_ENVIRONMENT=production
      - SUBROUTE_ACCOUNTING_SECRET
      # An explicit GATEWAY_MASTER_KEY enables the Admin UI and bearer-token auth.
      # Leave it unset for the default loopback-only, unauthenticated API.
      - GATEWAY_MASTER_KEY
      - CODEX_AUTH_FILE=/root/.codex/auth.json
      - ALLOW_PRIVATE_CONTROL=1
      - ADVISOR_MODEL=${ADVISOR_MODEL:-codex-gpt-6.1-sol-advisor}
      - ANTIGRAVITY_BRIDGE_URL=http://antigravity:4015
      - FREETOKEN_BASE_URL=${FREETOKEN_BASE_URL:-http://host.docker.internal:1919/v1}
      - FREETOKEN_API_KEY=${FREETOKEN_API_KEY:-local}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-password}
      - MINIMAX_API_KEY
      - XIAOMI_TOKENPLAN_API_KEY
      - OPENROUTER_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000", "--host", "0.0.0.0", "--telemetry", "False"]

  gateway-staging:
    image: subroute-gateway:advisor-ranker-v1
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      postgres-staging:
        condition: service_healthy
      antigravity:
        condition: service_healthy
    ports:
      - "127.0.0.1:4005:4005"
    volumes:
      - ./config:/app/config:ro
      - gateway-staging-state:/app/state
      - ./src:/app/src:ro
      - ~/.codex/auth.json:/root/.codex/auth.json:ro
    environment:
      - PYTHONPATH=/app/src
      - HEALTH_CHECK_TIMEOUT_SECONDS=10
      - ACTIVE_MODEL_STATE_PATH=/app/state/active_model.json
      - DATABASE_URL=postgresql://litellm:litellm-local-db@postgres-staging:5432/litellm_staging
      - SUBROUTE_ENVIRONMENT=staging
      # Keep staging review routed to Gemini 4 Argon even if the policy file is edited.
      - SUBROUTE_LOCKED_ADVISOR_MODEL=gemini-subscription-argon
      - LITELLM_LOG=INFO
      - SUBROUTE_ACCOUNTING_SECRET
      - GATEWAY_MASTER_KEY
      - CODEX_AUTH_FILE=/root/.codex/auth.json
      - ALLOW_PRIVATE_CONTROL=1
      - ADVISOR_MODEL=${ADVISOR_MODEL:-codex-gpt-6.1-sol-advisor}
      - ANTIGRAVITY_BRIDGE_URL=http://antigravity:4015
      - FREETOKEN_BASE_URL=${FREETOKEN_BASE_URL:-http://host.docker.internal:1919/v1}
      - FREETOKEN_API_KEY=${FREETOKEN_API_KEY:-local}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-password}
      - MINIMAX_API_KEY
      - XIAOMI_TOKENPLAN_API_KEY
      - OPENROUTER_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config/litellm.yaml", "--port", "4005", "--host", "0.0.0.0", "--telemetry", "False"]

  experts:
    image: ghcr.io/berriai/litellm-database@sha256:bd07ceb1fc7c4505f116c4eb2767956a8accba3119548dd8ae55e5356a381d56
    restart: unless-stopped
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./config:/app/config:ro
      - ./src:/app/src:ro
      - ~/.codex/auth.json:/root/.codex/auth.json:ro
    environment:
      - PYTHONPATH=/app/src
      - CODEX_AUTH_FILE=/root/.codex/auth.json
      - ANTIGRAVITY_BRIDGE_URL=http://antigravity:4015
      # The LAN listener must never run without bearer authentication.
      - "EXPERTS_API_KEY=${EXPERTS_API_KEY:?Set EXPERTS_API_KEY in .env before starting experts}"
    command: ["--config", "/app/config/litellm.experts.yaml", "--port", "4040", "--host", "0.0.0.0", "--telemetry", "False"]

  antigravity:
    build:
      context: .
      dockerfile: sidecars/antigravity/Dockerfile
    restart: unless-stopped
    environment:
      - GEMINI_FORCE_FILE_STORAGE=true
    volumes:
      - antigravity-config:/root/.config
      - antigravity-data:/root/.local/share
      - antigravity-gemini:/root/.gemini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4015/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Text-only Unsloth GGUF server, included in the default Compose stack.
  qwen-local:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:b0baccbe2e00b5d74e63f85f9f023c93d61d0f329475269e1e7002e87eb875ea
    restart: always
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - qwen-local-models:/root/.cache/huggingface
      - ./sidecars/qwen-local/start.sh:/app/qwen-start.sh:ro
    entrypoint: ["/bin/sh", "/app/qwen-start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --no-mmproj
      - --alias
      - qwen3.8-27b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "73728"
      - --n-predict
      - "4096"
      - --reasoning-effort
      - low
      - --reasoning-budget
      - "512"
      - --parallel
      - "1"
      - --n-gpu-layers
      - auto
      - --fit-target
      - "1536"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q4_0
      - --cache-type-v
      - q4_0

volumes:
  litellm-postgres-data:
  litellm-postgres-staging-data:
  gateway-staging-state:
  antigravity-config:
  antigravity-data:
  antigravity-gemini:
  qwen-local-models:
