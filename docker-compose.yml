services:
  postgres:
    image: postgres:16-alpine
    container_name: unified-llm-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm-local-db
      POSTGRES_DB: litellm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm-local-db
      POSTGRES_DB: litellm_staging
    volumes:
      - litellm-postgres-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm_staging"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    image: ghcr.io/berriai/litellm-database@sha256:bd07ceb1fc7c4505f116c4eb2767956a8accba3119548dd8ae55e5356a381d56
    container_name: unified-llm-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      antigravity:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config:/app/config
      - ./src:/app/src:ro
      - ~/.codex/auth.json:/root/.codex/auth.json:ro
    environment:
      - PYTHONPATH=/app/src
      # Preserve the existing production policy file during migration.
      - ACTIVE_MODEL_STATE_PATH=/app/config/active_model.json
      - DATABASE_URL=postgresql://litellm:litellm-local-db@postgres:5432/litellm
      # No GATEWAY_MASTER_KEY is passed by default, so loopback clients can use
      # the gateway without an Authorization header. Add one explicitly only
      # when client bearer-token auth is wanted.
      - CODEX_AUTH_FILE=/root/.codex/auth.json
      - ALLOW_PRIVATE_CONTROL=1
      - ADVISOR_MODEL=${ADVISOR_MODEL:-codex-terra-advisor}
      - ANTIGRAVITY_BRIDGE_URL=http://antigravity:4015
      - FREETOKEN_BASE_URL=${FREETOKEN_BASE_URL:-http://host.docker.internal:1919/v1}
      - FREETOKEN_API_KEY=${FREETOKEN_API_KEY:-local}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-sk-gateway-local-dev}
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - MINIMAX_API_KEY
      - OPENROUTER_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000", "--host", "0.0.0.0", "--telemetry", "False"]

  gateway-staging:
    image: ghcr.io/berriai/litellm-database@sha256:bd07ceb1fc7c4505f116c4eb2767956a8accba3119548dd8ae55e5356a381d56
    container_name: unified-llm-gateway-staging
    restart: unless-stopped
    depends_on:
      postgres-staging:
        condition: service_healthy
      antigravity:
        condition: service_healthy
    ports:
      - "127.0.0.1:4005:4005"
    volumes:
      - ./config:/app/config:ro
      - gateway-staging-state:/app/state
      - ./src:/app/src:ro
      - ~/.codex/auth.json:/root/.codex/auth.json:ro
    environment:
      - PYTHONPATH=/app/src
      - ACTIVE_MODEL_STATE_PATH=/app/state/active_model.json
      - DATABASE_URL=postgresql://litellm:litellm-local-db@postgres-staging:5432/litellm_staging
      - CODEX_AUTH_FILE=/root/.codex/auth.json
      - ALLOW_PRIVATE_CONTROL=1
      - ADVISOR_MODEL=${ADVISOR_MODEL:-codex-terra-advisor}
      - ANTIGRAVITY_BRIDGE_URL=http://antigravity:4015
      - FREETOKEN_BASE_URL=${FREETOKEN_BASE_URL:-http://host.docker.internal:1919/v1}
      - FREETOKEN_API_KEY=${FREETOKEN_API_KEY:-local}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-sk-gateway-local-dev}
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - MINIMAX_API_KEY
      - OPENROUTER_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config/litellm.yaml", "--port", "4005", "--host", "0.0.0.0", "--telemetry", "False"]

  experts:
    image: ghcr.io/berriai/litellm-database@sha256:bd07ceb1fc7c4505f116c4eb2767956a8accba3119548dd8ae55e5356a381d56
    container_name: unified-llm-gateway-experts
    restart: unless-stopped
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./config:/app/config:ro
      - ./src:/app/src:ro
      - ~/.codex/auth.json:/root/.codex/auth.json:ro
    environment:
      - PYTHONPATH=/app/src
      - CODEX_AUTH_FILE=/root/.codex/auth.json
      # Optional bearer token. Unset keeps the service loopback-only, like 4000.
      - EXPERTS_API_KEY
    command: ["--config", "/app/config/litellm.experts.yaml", "--port", "4040", "--host", "0.0.0.0", "--telemetry", "False"]

  antigravity:
    build: ./sidecars/antigravity
    restart: unless-stopped
    environment:
      - GEMINI_FORCE_FILE_STORAGE=true
    volumes:
      - antigravity-config:/root/.config
      - antigravity-data:/root/.local/share
      - antigravity-gemini:/root/.gemini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4015/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  litellm-postgres-data:
  litellm-postgres-staging-data:
  gateway-staging-state:
  antigravity-config:
  antigravity-data:
  antigravity-gemini:
