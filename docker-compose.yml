services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm-local-db
      POSTGRES_DB: litellm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
      - ./config/postgres/create-staging.sql:/docker-entrypoint-initdb.d/10-create-staging.sql:ro
    networks:
      - production
      - staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    image: subroute-gateway:local
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - production
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ${SUBROUTE_PRODUCTION_STATE_DIR:-./config}:/app/legacy-config
      - ~/.codex/auth.json:/root/.codex/auth.json:ro
    environment:
      - PYTHONPATH=/app/src
      - HEALTH_CHECK_TIMEOUT_SECONDS=10
      # Preserve the existing production policy file during migration.
      - ACTIVE_MODEL_STATE_PATH=/app/legacy-config/active_model.json
      - DATABASE_URL=postgresql://litellm:litellm-local-db@postgres:5432/litellm
      # Clients are trusted on loopback; upstream credentials stay server-side.
      # LiteLLM's native mode allows an unset public master key and disables its Admin UI.
      - LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY=true
      - CODEX_AUTH_FILE=/root/.codex/auth.json
      - ALLOW_PRIVATE_CONTROL=1
      - ANTIGRAVITY_BRIDGE_URL=http://antigravity:4015
      - FREETOKEN_BASE_URL=${FREETOKEN_BASE_URL:-http://host.docker.internal:1919/v1}
      - FREETOKEN_API_KEY=${FREETOKEN_API_KEY:-local}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-password}
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - MINIMAX_API_KEY
      - XIAOMI_TOKENPLAN_API_KEY
      - OPENROUTER_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000", "--host", "0.0.0.0", "--telemetry", "False"]

  gateway-staging:
    profiles: [staging]
    image: subroute-gateway:staging
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging
    ports:
      - "127.0.0.1:4005:4005"
    volumes:
      - gateway-staging-state:/app/state
      - ~/.codex/auth.json:/root/.codex/auth.json:ro
    environment:
      - PYTHONPATH=/app/src
      - HEALTH_CHECK_TIMEOUT_SECONDS=10
      - ACTIVE_MODEL_STATE_PATH=/app/state/active_model.json
      - DATABASE_URL=postgresql://litellm:litellm-local-db@postgres:5432/litellm_staging
      - LITELLM_LOG=INFO
      # Clients are trusted on loopback; upstream credentials stay server-side.
      - LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY=true
      - CODEX_AUTH_FILE=/root/.codex/auth.json
      - ALLOW_PRIVATE_CONTROL=1
      - ANTIGRAVITY_BRIDGE_URL=http://antigravity:4015
      - FREETOKEN_BASE_URL=${FREETOKEN_BASE_URL:-http://host.docker.internal:1919/v1}
      - FREETOKEN_API_KEY=${FREETOKEN_API_KEY:-local}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-password}
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - MINIMAX_API_KEY
      - XIAOMI_TOKENPLAN_API_KEY
      - OPENROUTER_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config/litellm.yaml", "--port", "4005", "--host", "0.0.0.0", "--telemetry", "False"]

  antigravity:
    profiles: [antigravity]
    build:
      context: .
      dockerfile: sidecars/antigravity/Dockerfile
    restart: unless-stopped
    networks:
      - production
      - staging
    environment:
      - GEMINI_FORCE_FILE_STORAGE=true
    volumes:
      - antigravity-config:/root/.config
      - antigravity-data:/root/.local/share
      - antigravity-gemini:/root/.gemini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4015/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  litellm-postgres-data:
  gateway-staging-state:
  antigravity-config:
  antigravity-data:
  antigravity-gemini:
networks:
  production:
  staging:
