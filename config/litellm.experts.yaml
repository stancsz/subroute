# A deliberately narrow API for compact expert consultations. Compose requires
# bearer authentication because the listener is reachable from the LAN.
# It exposes no executor aliases, routing state, UI, or advisor orchestration.
model_list:
  - model_name: gemini-3.8-flash-advisor
    model_info:
      max_input_tokens: 32000
      context_window: 32000
      auto_compact_token_limit: 25600
      compaction_scope: input
      display_name: Gemini 3.8 Flash Advisor (Low)
      capabilities: [text]
      selectable: false
      advisor_selectable: true
    litellm_params:
      model: antigravity/gemini-3.8-flash
      reasoning_effort: low
      allowed_openai_params: [reasoning_effort]

  - model_name: gemini-3.7-flash-advisor
    model_info:
      max_input_tokens: 32000
      context_window: 32000
      auto_compact_token_limit: 25600
