# A deliberately narrow, loopback-only API for compact expert consultations.
# It exposes no executor aliases, routing state, UI, or advisor orchestration.
model_list:
  - model_name: codex-luna-advisor
    model_info:
      <<: &context_policy
        max_input_tokens: 32000
        context_window: 32000
        auto_compact_token_limit: 25600
        compaction_scope: total
      display_name: GPT-6 Luna Advisor
      capabilities: [text, vision]
      selectable: false
      advisor_selectable: true
    litellm_params:
      model: codex-advisor/gpt-6-luna
      reasoning_effort: high
      allowed_openai_params: [reasoning_effort]

  - model_name: codex-sol-advisor
    model_info:
      <<: *context_policy
      display_name: GPT-6 Sol Advisor
      capabilities: [text, vision]
      selectable: false
      advisor_selectable: true
    litellm_params:
      model: codex-advisor/gpt-6-sol
      allowed_openai_params: [reasoning_effort]

  - model_name: codex-astra-advisor
    model_info:
      <<: *context_policy
      display_name: GPT-6 Astra Advisor
      capabilities: [text, vision]
      selectable: false
      advisor_selectable: true
    litellm_params:
      model: codex-advisor/gpt-6-astra
      allowed_openai_params: [reasoning_effort]

  - model_name: codex-gpt-6.1-sol-advisor
    model_info:
      <<: *context_policy
      display_name: GPT-6.1 Sol Advisor
      capabilities: [text, vision]
      selectable: false
      advisor_selectable: true
    litellm_params:
      model: codex-advisor/gpt-6.1-sol
      allowed_openai_params: [reasoning_effort]

router_settings:
  enable_pre_call_checks: true
  # An expert consultation succeeds once or fails visibly. Never retry or fall
  # through to another model, because that would hide both cost and provenance.
  num_retries: 0
  fallbacks: []

litellm_settings:
  custom_provider_map:
    - provider: codex-advisor
      custom_handler: subroute.handlers.codex_advisor.codex_advisor_handler
  drop_params: true
  set_verbose: false

general_settings:
  # Optional. When unset, loopback is the security boundary, matching port 4000.
  master_key: os.environ/EXPERTS_API_KEY
  disable_spend_logs: true
  disable_error_tracking: true
