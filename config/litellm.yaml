  - model_name: gemini-subscription-pro
    model_info:
      <<: *context_policy
      advisor_max_input_tokens: 32000
      display_name: Gemini 3.1 Pro
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      capabilities: [text, tools, buffered-sse]
      advisor_selectable: true
      reasoning_efforts: [low, high]
    litellm_params:
      model: antigravity/gemini-3.1-pro
      allowed_openai_params: [reasoning_effort]

  # The CustomLLM uses LiteLLM's OpenAI Responses adapter for the upstream
  # stream; LiteLLM retains ownership of public Chat, Responses, and Messages
  # conversion. The deployment hook rereads the Codex auth file per dispatch.
  - model_name: codex-subscription
    model_info:
      <<: *context_policy
      display_name: GPT-6 Sol
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max, ultra]
      capabilities: [tools, streaming]
    litellm_params:
      model: codex-subscription/gpt-6-sol
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      allowed_openai_params: [reasoning_effort]
      store: false

  - model_name: codex-astra
    model_info:
      <<: *context_policy
      display_name: GPT-6 Astra
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max, ultra]
      capabilities: [tools, streaming]
    litellm_params:
      model: codex-subscription/gpt-6-astra
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      allowed_openai_params: [reasoning_effort]
      store: false

  - model_name: codex-gpt-6.1-sol
    model_info:
      <<: *context_policy
      display_name: GPT-6.1 Sol
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max, ultra]
      capabilities: [tools, streaming]
    litellm_params:
      model: codex-subscription/gpt-6.1-sol
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      allowed_openai_params: [reasoning_effort]
      store: false

  - model_name: codex-luna
    model_info:
      <<: *context_policy
      display_name: GPT-6 Luna
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max]
      capabilities: [tools, streaming, image-generation]
    litellm_params:
      model: codex-subscription/gpt-6-luna
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      allowed_openai_params: [reasoning_effort]
      store: false

  # Stable client alias for the persisted routing-desk target. The routing
  # hook replaces this placeholder with the selected target before dispatch.
  - model_name: default
    model_info:
      <<: *context_policy
      selectable: false
      display_name: Default target
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max]
      capabilities: [tools, streaming]
    litellm_params:
      model: codex-subscription/gpt-6-luna
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      allowed_openai_params: [reasoning_effort]
      store: false

  - model_name: codex-gpt-6.1-sol-advisor
    model_info:
      <<: &advisor_context_policy
        max_input_tokens: 32000
