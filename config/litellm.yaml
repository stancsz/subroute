model_list:
  # Native provider adapters. Change model_name to the stable public aliases
  # that coding tools should select. Add deployments rather than Python code.
  # `auto` starts with the OpenRouter MiniMax M3.1 Flash route.
  - model_name: auto
    model_info:
      <<: &context_policy
        max_input_tokens: 256000
        context_window: 256000
        auto_compact_token_limit: 204800
        compaction_scope: total
      display_name: Auto
      selectable: false
      disable_background_health_check: true
    litellm_params:
      model: openrouter/minimax/minimax-m3.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning:
        exclude: true

  # Advisor-only Gemini alias keeps its fallback policy separate from the
  # public Gemini target route.
  - model_name: gemini-3.8-flash-advisor
    model_info:
      max_input_tokens: 32000
      context_window: 32000
      auto_compact_token_limit: 25600
      compaction_scope: total
      display_name: "Advisor fallback: Gemini 3.8 Flash"
      selectable: false
      disable_background_health_check: true
    litellm_params:
      model: antigravity/gemini-3.8-flash
      allowed_openai_params: [reasoning_effort]

  # Supplemental Advisor call on the verified Antigravity subscription model.
  - model_name: claude-opus-5-5-low-advisor
    model_info:
      max_input_tokens: 32000
      context_window: 32000
      auto_compact_token_limit: 25600
      compaction_scope: total
      display_name: "Supplemental Advisor: Claude Opus 5.5 Low"
      selectable: false
      disable_background_health_check: true
    litellm_params:
      model: antigravity/claude-opus-5-5-low

  - model_name: openrouter
    model_info:
      <<: *context_policy
      display_name: MiniMax M3.1 Flash
      provider: OpenRouter
      source_id: openrouter
      access: API key
      capabilities: [tools, streaming]
    litellm_params:
      model: openrouter/minimax/minimax-m3.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning:
        exclude: true

  - model_name: openrouter-flash
    model_info:
      <<: *context_policy
      display_name: MiniMax M3.1 Flash
      provider: OpenRouter
      source_id: openrouter
      access: API key
      capabilities: [tools, streaming]
    litellm_params:
      model: openrouter/minimax/minimax-m3.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning:
        exclude: true

  # In-process CustomLLM handler backed by the Compose CLI bridge sidecar.
  - model_name: gemini-subscription
    model_info:
      <<: *context_policy
      advisor_max_input_tokens: 32000
      display_name: Gemini 3.8 Flash
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      reasoning_efforts: [low, medium, high]
      capabilities: [text, audio, tools, buffered-sse]
      advisor_selectable: true
    litellm_params:
      model: antigravity/gemini-3.8-flash
      allowed_openai_params: [reasoning_effort]

  - model_name: gemini-subscription-argon
    model_info:
      <<: *context_policy
      advisor_max_input_tokens: 32000
      display_name: Gemini 4 Argon
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      reasoning_efforts: [low, medium, high]
      capabilities: [text, tools, buffered-sse]
      advisor_selectable: true
    litellm_params:
      model: antigravity/gemini-4-argon
      allowed_openai_params: [reasoning_effort]

  - model_name: gemini-subscription-3.7-flash
    model_info:
      <<: *context_policy
      advisor_max_input_tokens: 32000
      display_name: Gemini 3.7 Flash
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      capabilities: [text, tools, buffered-sse]
      advisor_selectable: true
      reasoning_efforts: [low, medium, high]
    litellm_params:
      model: antigravity/gemini-3.7-flash
