      api_base: os.environ/OLLAMA_API_BASE

  # Compose serves Unsloth Dynamic 3.0 IQ2_XXS through llama.cpp with two slots.
  # Each 40K slot reserves 32K for input/Sift, 4K for output and 4K headroom.
  - model_name: qwen3.8-27b
