model_list:
  # Native provider adapters. Change model_name to the stable public aliases
  # that coding tools should select. Add deployments rather than Python code.
  - model_name: current
    model_info:
      display_name: Current model
      selectable: false
    litellm_params:
      # The dynamic router resolves this virtual entry before deployment selection.
      model: openai/current

  - model_name: openai
    model_info:
      display_name: GPT-5.2 Codex
      provider: OpenAI
      source_id: openai
      access: API key
      reasoning_efforts: [low, medium, high]
      reasoning_note: Extra high is unavailable through the installed API adapter.
      capabilities: [tools, streaming]
    litellm_params:
      model: openai/gpt-5.2-codex
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gemini-api
    model_info:
      display_name: Gemini 3 Flash Preview
      provider: Gemini
      source_id: gemini
      access: API key
      reasoning_efforts: [minimal, low, medium, high]
      capabilities: [tools, vision, streaming]
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: openrouter
    model_info:
      display_name: MiniMax M3
      provider: OpenRouter
      source_id: openrouter
      access: API key
      reasoning_note: This M3 route uses adaptive thinking; graded effort levels are not exposed.
      capabilities: [tools, streaming]
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning:
        exclude: true

  # Antigravity runs as an in-process LiteLLM CustomLLM provider.
  - model_name: gemini-subscription
    model_info:
      display_name: Gemini 3.8 Flash
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      reasoning_efforts: [low, medium, high]
      capabilities: [text]
      advisor_selectable: true
    litellm_params:
      model: antigravity/gemini-3.8-flash
      allowed_openai_params: [reasoning_effort]

  - model_name: gemini-subscription-3.7-flash
    model_info:
      display_name: Gemini 3.7 Flash
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      capabilities: [text]
      advisor_selectable: true
      reasoning_efforts: [low, medium, high]
    litellm_params:
      model: antigravity/gemini-3.7-flash
      allowed_openai_params: [reasoning_effort]

  - model_name: gemini-subscription-3.6-flash
    model_info:
      display_name: Gemini 3.6 Flash
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      capabilities: [text]
      advisor_selectable: true
      reasoning_efforts: [low, medium, high]
    litellm_params:
      model: antigravity/gemini-3.6-flash
      allowed_openai_params: [reasoning_effort]

  - model_name: gemini-subscription-pro
    model_info:
      display_name: Gemini 3.1 Pro
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      capabilities: [text]
      advisor_selectable: true
      reasoning_efforts: [low, high]
    litellm_params:
      model: antigravity/gemini-3.1-pro
      allowed_openai_params: [reasoning_effort]

  # LiteLLM's native Responses-to-Chat bridge talks to the Codex subscription
  # backend. A deployment hook reloads the existing Codex auth file before
  # every dispatch, so refreshed credentials do not require a proxy restart.
  - model_name: codex-subscription
    model_info:
      display_name: GPT-6 Sol
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max, ultra]
      capabilities: [tools, streaming]
    litellm_params:
      model: openai/responses/gpt-6-sol
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      store: false

  - model_name: codex-astra
    model_info:
      display_name: GPT-6 Astra
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max, ultra]
      capabilities: [tools, streaming]
    litellm_params:
      model: openai/responses/gpt-6-astra
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      store: false

  - model_name: codex-terra
    model_info:
      display_name: GPT-5.6 Terra
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max, ultra]
      capabilities: [tools, streaming]
    litellm_params:
      model: openai/responses/gpt-5.6-terra
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      store: false

  - model_name: codex-luna
    model_info:
      display_name: GPT-6 Luna
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max]
      capabilities: [tools, streaming]
    litellm_params:
      model: openai/responses/gpt-6-luna
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      store: false

  - model_name: codex-reserve
    model_info:
      display_name: GPT Reserve
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max]
      capabilities: [tools, streaming]
    litellm_params:
      model: openai/responses/gpt-reserve
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      store: false

  - model_name: codex-terra-advisor
    model_info:
      display_name: GPT-5.6 Terra
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max, ultra]
      capabilities: [text]
      selectable: false
      advisor_selectable: true
    litellm_params:
      model: codex-advisor/gpt-5.6-terra
      allowed_openai_params: [reasoning_effort]

  - model_name: codex-sol-advisor
    model_info:
      display_name: GPT-6 Sol
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max, ultra]
      capabilities: [text]
      selectable: false
      advisor_selectable: true
    litellm_params:
      model: codex-advisor/gpt-6-sol
      allowed_openai_params: [reasoning_effort]

  - model_name: codex-astra-advisor
    model_info:
      display_name: GPT-6 Astra
      provider: OpenAI
      source_id: openai-subscription
      access: Codex subscription
      reasoning_efforts: [low, medium, high, xhigh, max, ultra]
      capabilities: [text]
      selectable: false
      advisor_selectable: true
    litellm_params:
      model: codex-advisor/gpt-6-astra
      allowed_openai_params: [reasoning_effort]



  - model_name: minimax
    model_info:
      display_name: MiniMax M3
      provider: MiniMax
      source_id: minimax
      access: API key
      reasoning_note: This M3 route uses adaptive thinking; graded effort levels are not exposed.
      capabilities: [tools, streaming]
    litellm_params:
      model: minimax/MiniMax-M3
      api_key: os.environ/MINIMAX_API_KEY

  # Native OpenAI-compatible transports. These are configuration, not custom
  # adapters. Override the base URLs when starting the gateway if necessary.
  - model_name: freetoken
    model_info:
      display_name: Endpoint default model
      provider: FreeToken
      source_id: freetoken
      access: Local endpoint
      reasoning_note: This local route has thinking disabled in its configuration.
      capabilities: [text, streaming]
    litellm_params:
      model: openai/local-model
      api_base: os.environ/FREETOKEN_BASE_URL
      api_key: os.environ/FREETOKEN_API_KEY
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: desktop
    model_info:
      display_name: Qwen 2.5 Coder
      provider: Ollama
      source_id: ollama
      access: Local endpoint
      reasoning_note: Qwen 2.5 Coder does not expose reasoning effort levels.
      capabilities: [local, text]
    litellm_params:
      model: ollama/qwen2.5-coder
      api_base: os.environ/OLLAMA_API_BASE

router_settings:
  # A selected deployment either succeeds or fails. The gateway does not hide
  # provider failures by retrying or falling back to another model.
  num_retries: 0
  fallbacks: []

litellm_settings:
  callbacks:
    - unified_llm_gateway.plugins.dynamic_router.dynamic_routing_plugin
    - unified_llm_gateway.plugins.advisor_plugin.advisor_plugin_instance
    - unified_llm_gateway.plugins.codex_credentials.codex_credential_refresher
  custom_provider_map:
    - provider: antigravity
      custom_handler: unified_llm_gateway.handlers.antigravity.antigravity_handler
    - provider: codex-advisor
      custom_handler: unified_llm_gateway.handlers.codex_advisor.codex_advisor_handler
  # This removes known unsupported top-level parameters. It does not guarantee
  # cross-provider tool, vision, context, reasoning, or streaming compatibility.
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/GATEWAY_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: true
  disable_error_tracking: true
  allow_requests_on_db_unavailable: false
