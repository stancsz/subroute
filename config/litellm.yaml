      api_key: os.environ/OPENROUTER_API_KEY
      allowed_openai_params: [reasoning]

  # Direct MiniMax M3.1 Flash route, with a separate selectable alias.
  - model_name: minimax-flash-direct
    model_info:
      <<: *context_policy
      display_name: "MiniMax: MiniMax M3.1 Flash"
      provider: MiniMax
      source_id: minimax
      reasoning_efforts: [low, medium, high, xhigh, max]
      supports_reasoning: true
      supports_adaptive_thinking: true
      supports_output_config: true
    litellm_params:
      model: minimax/MiniMax-M3.1-Flash
      api_key: os.environ/MINIMAX_API_KEY
      # MiniMax's native Chat adapter still rejects this documented field
      # without the narrow allowlist, including through the Responses bridge.
      allowed_openai_params: [reasoning_effort]

  # LiteLLM 1.101.0 has a native MiniMax TTS provider for /v1/audio/speech.
