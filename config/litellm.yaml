      api_key: local
      # Codex speaks Responses; LiteLLM owns its bridge to this Chat-only server.
      use_chat_completions_api: true

router_settings:
  enable_pre_call_checks: true
  # Bound every provider attempt so one stalled upstream cannot stall the
  # ordered chain. LiteLLM applies it per attempt, not to the whole chain.
  timeout: 45
  # Catch provider failures for eligible text/chat requests in one consistent
  # order. The request model stays client-visible; only the internal provider
  # changes. The pre-call hook disables this chain for media and special APIs.
  default_fallbacks: [openrouter, mimo-v2.6-pro, codex-luna]
  # Try the configured chain once, without recursively reopening it from a
  # failed fallback target. This preserves order and prevents provider repeats.
  max_fallbacks: 1
  num_retries: 0
  model_group_retry_policy:
    gemini-subscription:
      ContentPolicyViolationErrorRetries: 2
  fallbacks:
    # These targets are themselves members of the default chain. Skip the
    # current provider so the fallback walk never repeats an attempt.
    - auto: [mimo-v2.6-pro, codex-luna]
    - openrouter: [mimo-v2.6-pro, codex-luna]
    # `openrouter-flash` and `minimax-flash` are the same OpenRouter M3.1 Flash
    # route. The duplicate OpenRouter provider is skipped, so both walk
    # MiMo V2.6 Pro and then GPT-6 Luna exactly once.
    - openrouter-flash: [mimo-v2.6-pro, codex-luna]
    - minimax-flash: [mimo-v2.6-pro, codex-luna]
    - mimo-v2.6-pro: [openrouter, codex-luna]
    - mimo-v2.6-flash: [openrouter, codex-luna]
    - mimo-v2.5-pro: [openrouter, codex-luna]
    - mimo-v2.5: [openrouter, codex-luna]
    - codex-luna: [openrouter, mimo-v2.6-pro]
    # Keep Advisor failover separate from the target catch-all chain.
    - gemini-3.8-flash-advisor: [codex-gpt-6.1-sol-advisor]
    - codex-gpt-6.1-sol-advisor: [gemini-3.8-flash-advisor]
    - codex-sol-advisor: []
    - codex-astra-advisor: []
    - codex-luna-advisor: []

search_tools:
  - search_tool_name: subroute-searxng
    litellm_params:
      search_provider: searxng
      api_base: os.environ/SEARXNG_API_BASE

litellm_settings:
  # Xiaomi and local OpenAI-compatible backends implement Chat Completions.
  # The default Messages-to-Responses bridge sends them to the wrong endpoint.
  # Native Messages providers and custom subscription handlers keep their lanes.
  use_chat_completions_url_for_anthropic_messages: true
  callbacks:
    - subroute.usage_accounting.usage_accounting
    - subroute.plugins.dynamic_router.dynamic_routing_plugin
    # Heal oversized automatic-route histories before advisor/provider checks.
    - subroute.sift_plugin.sift_auto_hook
    # Local Qwen Sift is enabled by default; requests need no opt-in.
    - subroute.sift_plugin.sift_qwen_hook
    - subroute.plugins.advisor_plugin.advisor_plugin_instance
    # Apply the shared text-target forwarding budget after routing and advisor guidance.
    - subroute.sift_plugin.sift_target_hook
    - subroute.plugins.codex_credentials.codex_credential_refresher
    - websearch_interception
  custom_provider_map:
    - provider: codex-subscription
      custom_handler: subroute.handlers.codex_subscription.codex_subscription_handler
    - provider: antigravity
      custom_handler: subroute.handlers.antigravity.antigravity_handler
    - provider: codex-advisor
      custom_handler: subroute.handlers.codex_advisor.codex_advisor_handler
  websearch_interception_params:
    enabled_providers: ["openrouter"]
    search_tool_name: "subroute-searxng"
  # This removes known unsupported top-level parameters. It does not guarantee
  # cross-provider tool, vision, context, reasoning, or streaming compatibility.
  drop_params: true
  # Keep request/response bodies out of LiteLLM logs while retaining token and
  # cost records in Postgres for local Subroute traffic.
  turn_off_message_logging: true
  set_verbose: false

general_settings:
  # Cancel bounded provider work if a buffered client disconnects.
  cancel_on_disconnect: true
  master_key: os.environ/GATEWAY_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  health_check_concurrency: 2
  health_check_skip_disabled_background_models: true
  disable_spend_logs: false
  disable_error_tracking: true
  allow_requests_on_db_unavailable: false
