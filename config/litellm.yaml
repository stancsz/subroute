        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      allowed_openai_params: [reasoning_effort]
      store: false

  # Stable client alias for the persisted routing-desk target. The routing
  # hook replaces this placeholder with the selected target before dispatch.
  - model_name: minimax
    model_info:
      <<: *context_policy
      display_name: "MiniMax: MiniMax M3"
      provider: MiniMax
      source_id: minimax
    litellm_params:
      model: minimax/MiniMax-M3
      # Keep thinking out of visible Chat/Responses text (native provider switch).
      reasoning_split: true
      api_key: os.environ/MINIMAX_API_KEY

  # Existing OpenRouter-backed alias remains unchanged.
  - model_name: minimax/minimax-m3.1-flash
    model_info:
      <<: *context_policy
      display_name: "MiniMax: MiniMax M3.1 Flash"
      provider: OpenRouter
      source_id: openrouter
