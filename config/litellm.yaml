  - model_name: minimax
    model_info:
      <<: *context_policy
      display_name: MiniMax M3
      provider: MiniMax
      source_id: minimax
      access: API key
      reasoning_note: This M3 route uses adaptive thinking; graded effort levels are not exposed.
      capabilities: [tools, streaming]
    litellm_params:
      model: minimax/MiniMax-M3
      # Keep thinking out of visible Chat/Responses text (native provider switch).
      reasoning_split: true
      api_key: os.environ/MINIMAX_API_KEY

  # Public alias for the M3.1 Flash route. The alias stays stable for clients
