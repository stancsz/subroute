model_list:
  # Native provider adapters. Change model_name to the stable public aliases
  # that coding tools should select. Add deployments rather than Python code.
  - model_name: current
    model_info:
      <<: &context_policy
        max_input_tokens: 256000
        context_window: 256000
        auto_compact_token_limit: 204800
        compaction_scope: total
      display_name: Current model
      selectable: false
      disable_background_health_check: true
    litellm_params:
      # The dynamic router resolves this virtual entry before deployment selection.
      model: openai/current

  # Explicit automatic route. LiteLLM tries this MiniMax deployment first,
  # then the configured Gemini and Codex subscription groups on provider error.
  - model_name: auto
    model_info:
      <<: *context_policy
      display_name: Auto
      selectable: false
      disable_background_health_check: true
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning:
        exclude: true

  # Private fallback groups keep this chain scoped to `auto`; requests made
  # directly to gemini-subscription or codex-luna remain fail-closed.
  - model_name: auto-gemini-subscription
    model_info:
      <<: *context_policy
      display_name: "Auto fallback: Gemini 3.8 Flash"
      selectable: false
      disable_background_health_check: true
    litellm_params:
      model: antigravity/gemini-3.8-flash
      allowed_openai_params: [reasoning_effort]

  - model_name: auto-codex-luna
    model_info:
      <<: *context_policy
      display_name: "Auto fallback: Codex Luna"
      selectable: false
      disable_background_health_check: true
    litellm_params:
      model: codex-subscription/gpt-6-luna
      api_base: https://chatgpt.com/backend-api/codex
      api_key: refreshed-at-dispatch
      extra_headers:
        ChatGPT-Account-ID: refreshed-at-dispatch
        User-Agent: OpenAI-Codex/0.151.0 (Windows)
      allowed_openai_params: [reasoning_effort]
      store: false

  # Advisor-only Gemini alias keeps its fallback policy separate from the
  # public Gemini target route.
  - model_name: gemini-3.8-flash-advisor
    model_info:
      max_input_tokens: 32000
      context_window: 32000
      auto_compact_token_limit: 25600
      compaction_scope: total
      display_name: "Advisor fallback: Gemini 3.8 Flash"
      selectable: false
      disable_background_health_check: true
    litellm_params:
      model: antigravity/gemini-3.8-flash
      allowed_openai_params: [reasoning_effort]

  - model_name: openrouter
    model_info:
      <<: *context_policy
      display_name: MiniMax M3
      provider: OpenRouter
      source_id: openrouter
      access: API key
      reasoning_note: This M3 route uses adaptive thinking; graded effort levels are not exposed.
      capabilities: [tools, streaming]
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning:
        exclude: true

  # In-process CustomLLM handler backed by the Compose CLI bridge sidecar.
  - model_name: gemini-subscription
    model_info:
      <<: *context_policy
      advisor_max_input_tokens: 32000
      display_name: Gemini 3.8 Flash
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      reasoning_efforts: [low, medium, high]
      capabilities: [text, audio, tools, buffered-sse]
      advisor_selectable: true
    litellm_params:
      model: antigravity/gemini-3.8-flash
      allowed_openai_params: [reasoning_effort]

  - model_name: gemini-subscription-3.7-flash
    model_info:
      <<: *context_policy
      advisor_max_input_tokens: 32000
      display_name: Gemini 3.7 Flash
      provider: Gemini
      source_id: gemini-subscription
      access: Subscription
      capabilities: [text, tools, buffered-sse]
      advisor_selectable: true
      reasoning_efforts: [low, medium, high]
    litellm_params:
      model: antigravity/gemini-3.7-flash
