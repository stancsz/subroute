      capabilities: [text, tools, buffered-sse]
      advisor_selectable: true
      reasoning_efforts: [low, high]
    litellm_params:
      model: antigravity/gemini-3.1-pro
      allowed_openai_params: [reasoning_effort]

  # The CustomLLM uses LiteLLM's OpenAI Responses adapter for the upstream
  # stream; LiteLLM retains ownership of public Chat, Responses, and Messages
  # conversion. The deployment hook rereads the Codex auth file per dispatch.
  - model_name: codex-subscription
